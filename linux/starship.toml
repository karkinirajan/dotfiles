# ~/.config/starship.toml
# Cross-platform terminal prompt configuration
# Docs: https://starship.rs/config/

# ── Prompt format ────────────────────────────────────────────────────────────
# Order of modules from left to right
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$nodejs\
$python\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ── General ──────────────────────────────────────────────────────────────────
[line_break]
disabled = true   # Keep prompt on one line; set to false for two-line prompt

# ── Username ─────────────────────────────────────────────────────────────────
[username]
show_always = false                # only show when needed (SSH, root)
style_user  = "bold dimmed blue"
style_root  = "bold red"
format      = "[$user]($style) "

# ── Hostname ─────────────────────────────────────────────────────────────────
[hostname]
ssh_only  = true                   # only show hostname over SSH
format    = "<[$hostname]($style)>"
trim_at   = "-"
style     = "bold dimmed white"
disabled  = false

# ── Directory ────────────────────────────────────────────────────────────────
[directory]
truncation_length    = 4           # show 4 path components
truncate_to_repo     = true        # truncate to git root when inside a repo
format               = "[$path]($style)[$read_only]($read_only_style) "
style                = "bold cyan"
read_only            = " 󰌾"
read_only_style      = "red"
home_symbol          = "~"

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
format  = "[$symbol$branch(:$remote_branch)]($style) "
symbol  = " "
style   = "bold purple"

[git_commit]
commit_hash_length = 8
style              = "bold white"
tag_symbol         = "  "
only_detached      = true

[git_state]
format      = '\([$state( $progress_current/$progress_total)]($style)\) '
style       = "bold yellow"
rebase      = "REBASE"
merge       = "MERGE"
revert      = "REVERT"
cherry_pick = "CHERRY-PICK"
bisect      = "BISECT"
am          = "AM"
am_or_rebase = "AM/REBASE"

[git_status]
format      = '([\[$all_status$ahead_behind\]]($style) )'
style       = "bold red"
conflicted  = "⚔️ "
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇕⇡${ahead_count}⇣${behind_count}"
untracked   = "?${count}"
stashed     = "≡"
modified    = "!${count}"
staged      = "+${count}"
renamed     = "»${count}"
deleted     = "✘${count}"

[git_metrics]
added_style   = "bold green"
deleted_style = "bold red"
format        = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
disabled      = false

# ── Languages (shown only when in a relevant project) ─────────────────────────
[nodejs]
format  = "[$symbol($version )]($style)"
symbol  = " "
style   = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
format          = "[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)"
symbol          = " "
style           = "bold yellow"
detect_files    = ["requirements.txt", "pyproject.toml", "setup.py", "Pipfile", ".python-version"]
pyenv_version_name = true

[rust]
format  = "[$symbol($version )]($style)"
symbol  = " "
style   = "bold red"

[golang]
format  = "[$symbol($version )]($style)"
symbol  = " "
style   = "bold cyan"

[java]
format  = "[$symbol($version )]($style)"
symbol  = " "
style   = "bold red"

# ── Docker ───────────────────────────────────────────────────────────────────
[docker_context]
format  = "[$symbol$context]($style) "
symbol  = " "
style   = "blue bold"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ── System ───────────────────────────────────────────────────────────────────
[battery]
full_symbol        = "🔋"
charging_symbol    = "🔌"
discharging_symbol = "⚡"
unknown_symbol     = "❓"
empty_symbol       = "🪫"
disabled           = false

[[battery.display]]
threshold = 30
style     = "bold red"

[[battery.display]]
threshold = 70
style     = "bold yellow"

[[battery.display]]
threshold = 100
style     = "bold green"

[memory_usage]
format    = "$symbol[${ram}( | ${swap})]($style) "
threshold = 70
style     = "bold dimmed white"
symbol    = "󰍛 "
disabled  = false

[cmd_duration]
min_time           = 5_000   # show duration for commands taking > 5s
format             = "took [$duration]($style) "
style              = "bold yellow"
show_milliseconds  = false
show_notifications = false

[status]
format   = "[$symbol$status]($style) "
symbol   = "✖ "
style    = "bold red"
disabled = false

# ── Fill (pushes right-side modules to the right) ────────────────────────────
[fill]
symbol = " "

# ── Prompt character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"   # shows in Zsh Vi mode (Normal)

# ── Package version (disabled — too slow for large projects) ─────────────────
[package]
disabled = true

# ── Julia (optional language) ────────────────────────────────────────────────
[julia]
format  = "[$symbol($version )]($style)"
symbol  = "ஃ "
style   = "bold green"
