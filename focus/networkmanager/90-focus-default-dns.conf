[main]
# focus needs to own /etc/resolv.conf so it can point the whole system at the
# blocking dnsmasq on 127.0.0.1.
#
# dns=none        -> NetworkManager does not manage DNS or write resolv.conf.
# rc-manager=unmanaged -> NM never rewrites/symlinks /etc/resolv.conf at all.
#
# Previously these were dns=default + rc-manager=symlink, which made
# /etc/resolv.conf a symlink into /run/NetworkManager/ (tmpfs). NM regenerated
# it on every network event, silently reverting "nameserver 127.0.0.1" back to
# the upstream DNS — so focus mode was bypassed system-wide, and chattr +i
# could not protect it because tmpfs has no immutable flag.
dns=none
rc-manager=unmanaged
systemd-resolved=false
