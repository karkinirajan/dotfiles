# General
$filemanager = kitty -e yazi
$applauncher = ~/.config/hypr/scripts/launcher-open.sh
$terminal = kitty

# Screenshots
$shot-region = grimblast copy area
$shot-window = grimblast copy active
$shot-screen = grimblast copy output

# WallRizz wallpaper/theme picker (https://github.com/5hubham5ingh/WallRizz)
# Handler script for hyprpaper lives at ~/.config/WallRizz/
$wallpaperDir = /home/kneeraazon/.wallpapers
$WR = wallrizz -n -e -d $wallpaperDir
$WallRizz = kitty -1 -o allow_remote_control=yes --title=WallRizz $WR
$WallRizzRandom = kitty -1 -o allow_remote_control=yes --class=hidden --title=hidden $WR -r