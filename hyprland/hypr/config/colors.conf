# Official palette: https://catppuccin.com/palette — Mocha flavor.
# This is the single source of truth for the accent/base colors used across
# Hyprland, Waybar, wofi, kitty, and hyprlock — all of them are themed from
# this same palette so an accent change here stays consistent everywhere.

$rosewater = rgba(f5e0dcff)
$flamingo  = rgba(f2cdcdff)
$pink      = rgba(f5c2e7ff)
$mauve     = rgba(cba6f7ff)
$red       = rgba(f38ba8ff)
$maroon    = rgba(eba0acff)
$peach     = rgba(fab387ff)
$yellow    = rgba(f9e2afff)
$green     = rgba(a6e3a1ff)
$teal      = rgba(94e2d5ff)
$sky       = rgba(89dcebff)
$sapphire  = rgba(74c7ecff)
$blue      = rgba(89b4faff)
$lavender  = rgba(b4befeff)

$text      = rgba(cdd6f4ff)
$subtext1  = rgba(bac2deff)
$subtext0  = rgba(a6adc8ff)
$overlay2  = rgba(9399b2ff)
$overlay1  = rgba(7f849cff)
$overlay0  = rgba(6c7086ff)
$surface2  = rgba(585b70ff)
$surface1  = rgba(45475aff)
$surface0  = rgba(313244ff)
$base      = rgba(1e1e2eff)
$mantle    = rgba(181825ff)
$crust     = rgba(11111bff)

# Dimmed accent for inactive window borders (same mauve, lower alpha)
$blue_dim  = rgba(cba6f766)

# Primary accent used everywhere: active workspace, active border, power
# button, waybar highlights. Catppuccin Mocha mauve (purple/indigo focus),
# matching the Quickshell bar's Theme.qml. Solid, full alpha.
$ctp_accent = $mauve
