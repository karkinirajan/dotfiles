# Tracked in 05-ai/ollama/systemd/claude-code.conf (originally generated by
# 05-ai/ollama/claude-code-bench/root-steps/01-vulkan-and-base-config.sh).
# See 05-ai/ollama/claude-code-bench/ollama-claude-setup.md for the measurements
# behind every value.
#
# Deliberately absent: OLLAMA_CONTEXT_LENGTH. Setting it here would apply a
# fixed context to EVERY model on this server, including whatever
# Continue.dev asks for. Context is set per-model via Modelfile `num_ctx`.
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=30m"
