config_version = 14

[audio]
enable_overdrive = true
sound_volume = 0.99999997764825821

[bar]
order = [ "kneeraazon" ]

    [bar.kneeraazon]
    border = "#cba6f7aa"
    border_width = 1.5
    capsule = true
    capsule_border = "#cba6f799"
    capsule_fill = "on_primary"
    capsule_padding = 8.0
    capsule_radius = 2
    capsule_thickness = 0.71999998763203621
    center = []
    concave_edge_corners = false
    contact_shadow = true
    end = [
        "clock",
        "summary",
        "bar",
        "weather",
        "notifications",
        "clipboard",
        "volume",
        "nightlight",
        "network",
        "bluetooth",
        "control-center",
        "tray",
        "session"
    ]
    font_family = "JetBrains Mono"
    font_weight = 700
    margin_ends = 0
    padding = 8
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    radius_top_left = 0
    radius_top_right = 0
    start = [ "workspaces", "taskbar", "active_window", "media" ]
    thickness = 42
    widget_spacing = 8

        [[bar.kneeraazon.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#CBA6F799"
        enabled = true
        fill = "primary"
        id = "g1"
        members = [ "active_window", "media", "audio_visualizer" ]
        opacity = 0.0
        padding = 10.0
        radius = 4.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.99999997764825821
sync_all_monitors = true

[calendar]
enabled = true

[control_center]
