# ┃                   Satty Configuration                       ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Modern GTK4/OpenGL screenshot annotator paired with grim + slurp
# (see ~/.config/hypr/scripts/screenshot.sh).

[general]
fullscreen = false
resize = { mode = "smart" }
floating-hack = true
auto-copy = false
# Close Satty automatically after an explicit copy or save action.
early-exit = ["copy", "save", "save-as"]
corner-roundness = 12
initial-tool = "arrow"
copy-command = "wl-copy --type image/png"
annotation-size-factor = 1.5
output-filename = "~/Pictures/Screenshots/screenshot-%Y%m%d-%H%M%S.png"
# When copying from Satty (Ctrl+C or Copy button), also write the annotated
# image back to output-filename so disk and clipboard stay identical.
save-after-copy = true
default-hide-toolbars = false
focus-toggles-toolbars = false
default-fill-shapes = false
default-round-caps = true
primary-highlighter = "block"
disable-notifications = false
# Enter saves the annotated image to both clipboard and file, then exits.
# Escape exits without overwriting the raw capture already saved by screenshot.sh.
actions-on-enter = ["save-to-clipboard", "save-to-file", "exit"]
actions-on-escape = ["exit"]
actions-on-right-click = []
no-window-decoration = true
brush-smooth-history-size = 10
pan-step-size = 50.0
zoom-factor = 1.1
text-move-length = 50.0
title = "Satty"
app-id = "org.satty.satty"
notification-thumbnail = "screenshot"

[keybinds]
pointer = "p"
crop = "c"
brush = "b"
line = "i"
arrow = "z"
rectangle = "r"
ellipse = "e"
text = "t"
marker = "m"
blur = "u"
highlight = "g"

[font]
family = "JetBrains Mono"
style = "Bold"
fallback = [
    "DejaVu Sans",
    "Noto Sans",
]

[color-palette]
palette = [
    "#ff5555ff",
    "#ffb86cff",
    "#f1fa8cff",
    "#50fa7bff",
    "#8be9fdff",
    "#bd93f9ff",
    "#ff79c6ff",
    "#f8f8f2ff",
    "#282a36ff",
]
custom = []
