# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/Configuring/Keywords/#executing

# ## No applications are started on login — the session comes up on an empty
# ## workspace. The previous fixed layout (Chrome on workspace 1; kitty x2,
# ## Mailspring and Spotify on workspace 2) was removed deliberately; the
# ## exec-once lines below are session infrastructure only (shell, clipboard,
# ## idle, theme sync), not user-facing apps.

# hyprpm-managed plugins (Hyprspace, ...) — `-n` skips the update check so
# this doesn't block startup on a network round-trip; re-ensures every
# enabled plugin is actually loaded into this Hyprland instance.
exec-once = hyprpm reload -n

# hyprpaper removed 2026-09-06 — it was fighting Noctalia's own built-in
# wallpaper layer for the same background slot (both render at layer
# level 0; whichever loaded last visually won), so wallpaper changes made
# via hyprpaper/WallRizz frequently appeared to just not work. Noctalia
# already ships a full wallpaper manager (drives its own accent-color
# theming and can sync to the login screen — see `noctalia msg
# wallpaper-set/-next/-previous/-random`, `color-scheme-set wallpaper`,
# and `greeter-sync`), so it's the single source of truth for wallpaper
# now; nothing needs to launch it here since Noctalia itself renders its
# own wallpaper layer on startup.

# Runs Noctalia under a watchdog loop (not a systemd --user service) so a
# crash (observed: fatal Wayland dispatch error on session lock/unlock)
# gets auto-restarted instead of leaving the bar gone until next reboot.
# MUST NOT be a systemd service: apps launched from Noctalia's own launcher
# inherit its cgroup, and Chromium's sandbox cannot tolerate living inside
# a systemd service scope — every Chrome/Brave launch from the launcher
# crashed instantly with SIGSEGV until this was a plain process tree again
# (confirmed via coredumpctl: crash reports showed
# .../app.slice/noctalia.service as the control group every time).
exec-once = ~/.config/hypr/scripts/noctalia-watchdog.sh &
# fcitx5 removed: the binary is not installed, so this exec-once silently
# no-opped every login. Reinstate together with `pacman -S fcitx5` if an IME
# is ever wanted.
# mako retired — Noctalia owns org.freedesktop.Notifications itself and the
# two conflict over who registers the DBus notification service.
# exec-once = mako &
# nm-applet retired — Noctalia's native network widget replaces its tray icon.
# exec-once = nm-applet --indicator &
exec-once = wl-paste --watch cliphist store &
# wob retired — the binary is not installed, so this line only ever left a
# `tail -f` and its parent shell running for the whole session, feeding a
# pipe with nothing on the other end. Noctalia draws its own volume and
# brightness OSD, so nothing is lost. Reinstate with `pacman -S wob` if a
# standalone bar is ever wanted again.
# exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown" &
# KDE's polkit agent removed along with the rest of Plasma —
# hyprpolkitagent is the Hyprland-native equivalent (already installed,
# just wasn't autostarted since KDE's own agent was covering this). Enabled
# as its own systemd --user service (see `systemctl --user enable
# --now hyprpolkitagent`), not exec-once here, since it ships one and it's
# just an auth-dialog agent — not a launcher whose spawned children would
# inherit a systemd unit's cgroup (that's the noctalia-watchdog.sh problem,
# doesn't apply here).

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

# ## Idle configuration
exec-once = hypridle

# ## Keep Hyprland's window border color synced to Noctalia's active theme
# ## (topbar item borders <-> window borders), so a theme change stays
# ## consistent everywhere without manual re-syncing.
exec-once = ~/.config/hypr/scripts/sync-theme-border.sh
exec-once = ~/.config/hypr/scripts/theme-border-watch.sh &
