# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Enviroment Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

envd = HYPRCURSOR_THEME,catppuccin-mocha-blue-cursors
envd = HYPRCURSOR_SIZE,24
envd = XCURSOR_THEME,catppuccin-mocha-blue-cursors
envd = XCURSOR_SIZE,24
envd = QT_CURSOR_SIZE,24
envd = COLORTERM,truecolor
envd = GTK_THEME,catppuccin-mocha-blue-standard+default

# Default terminal for anything that does not read Hyprland's $terminal —
# yazi's shell-out, xdg-terminal-exec, Noctalia's launcher, and the various
# tools that honour $TERMINAL. Keep in step with $terminal in defaults.conf.
envd = TERMINAL,alacritty
