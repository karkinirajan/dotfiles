# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃              Hyprpm-managed Plugin Configuration             ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Plugins themselves are installed/enabled via `hyprpm` (see
# autostart.conf's `hyprpm reload -n`), not here — this file only holds
# their `plugin:...` config keywords, which Hyprland accepts once the
# matching plugin .so is actually loaded.

# Hyprspace (https://github.com/KZDKM/Hyprspace) — workspace overview,
# similar to GNOME/macOS Mission Control. Installed from
# https://github.com/ImanolBarba/Hyprspace @ migrate-v2 (PR #238 against
# upstream), since upstream KZDKM/Hyprspace doesn't build against Hyprland
# 0.56+ yet (open issue: github.com/KZDKM/Hyprspace/issues/239).
plugin {
    overview {
        # Match the Shades of Jade accent used everywhere else (bar item
        # borders, active window border) via the same hex the rest of the
        # theme is synced to.
        panelColor = rgba(00110bee)
        panelBorderColor = rgba(00a86bee)
        workspaceActiveBackground = rgba(00a86b33)
        workspaceInactiveBackground = rgba(1c372a99)
        workspaceActiveBorder = rgba(00a86bff)
        workspaceInactiveBorder = rgba(3E665088)
        workspaceBorderSize = 2
        panelHeight = 200
        panelBorderWidth = 2
        centerAligned = true
        workspaceMargin = 12
        # Mirror the real gaps (variables.conf: gaps_in=4, gaps_out=0,1,1,1)
        # so workspace thumbnails preview the actual layout, not the plugin's
        # own factory-default spacing.
        overrideGaps = true
        gapsIn = 4
        gapsOut = 1
    }
}

# hy3 (https://github.com/outfoxxed/hy3) — i3/sway-style manual tiling
# layout engine, installed as an ALTERNATIVE to dwindle, not a replacement.
# Upstream fails to build on Hyprland 0.56.x (open issue #334 — moved
# header path); installed from https://github.com/kociap/hy3 instead,
# which carries the fix.
#
# NOT set as the active layout — `general:layout` is still `dwindle`
# elsewhere in variables.conf, since switching changes how every window
# tiles. To try hy3, change that line to `layout = hy3` and reload.

# split-monitor-workspaces
# (https://github.com/Duckonaut/split-monitor-workspaces) — gives each
# monitor its own independent set of workspace numbers (awesome-wm style)
# instead of sharing one global numbering across monitors. Loaded and
# ready, but NOT wired into keybinds.conf's workspace switching yet — that
# would mean remapping every $mainMod+[0-9]/SHIFT/CTRL bind from
# `workspace`/`movetoworkspace(silent)` to this plugin's
# `split-workspace`/`split-movetoworkspace(silent)` dispatchers, which
# changes how ~30 existing keybinds behave. Ask before that rewrite;
# for now the plugin is available but inert.

# hyprland-plugins repo (hyprbars, csgo-vulkan-fix, hyprfocus,
# borders-plus-plus) — removed entirely 2026-09-05. hyprbars clashed with
# the borderless/minimal aesthetic this setup is built around; hyprfocus
# and borders-plus-plus were disabled per explicit request (the latter's
# extra window-border glow was mistaken for a hyprfocus effect since they
# shared this repo); csgo-vulkan-fix was never used. With all four
# disabled, `hyprpm remove hyprland-plugins` dropped the repo entirely.

# dynamic-cursors
# (https://github.com/VirtCode/hypr-dynamic-cursors) — cursor tilts
# slightly in the direction of movement; shake-to-find enabled (KDE/macOS
# style) for locating the cursor on this 27" monitor.
plugin {
    dynamic-cursors {
        enabled = true
        mode = tilt
        shake {
            enabled = true
            effects = true
            threshold = 5.5
            base = 3.5
            speed = 4
            limit = 6
            timeout = 1500
        }
    }
}
