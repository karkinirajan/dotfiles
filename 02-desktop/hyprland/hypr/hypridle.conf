general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = ~/.config/hypr/scripts/dpms.sh enable
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/dpms.sh disable
    on-resume = ~/.config/hypr/scripts/dpms.sh enable
}

# Automatic deep suspend is disabled: recent suspend attempts do not resume and
# result in a reboot/session loss. The lock (5 min) and DPMS-off (5.5 min)
# listeners above remain enabled.
