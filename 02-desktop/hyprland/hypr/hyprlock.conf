source = ~/.config/hypr/config/colors.conf

general {
    disable_loading_bar = false
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /usr/share/wallpapers/cachyos-wallpapers/Skyscraper.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.35
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 90
    font_family = DejaVu Sans
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $lavender
    font_size = 22
    font_family = DejaVu Sans
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "Hi $(whoami), welcome back"
    color = $subtext1
    font_size = 16
    font_family = DejaVu Sans
    position = 0, -220
    halign = center
    valign = center
}
