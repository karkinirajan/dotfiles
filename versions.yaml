constraints:
- id: hyprland-hold
  text: Hyprland stays on the CachyOS-delivered 0.56.2 until a Lua config is validated; 0.57.0 ignores hyprland.conf
  requires:
  - key: hyprland
    op: <=
    value: 0.56.2
- id: rocm-pytorch-index
  text: PyTorch wheel index must match the ROCm legacy train
  requires:
  - key: rocm
    op: ==
    value: '7.2'
    width: 2
  - key: pytorch-rocm-index
    op: ==
    value: '7.2'
- id: pgvector-pg18
  text: pgvector 0.8 line supports PostgreSQL 18
  requires:
  - key: pgvector
    op: '>='
    value: '0.8'
    width: 2
  - key: postgresql
    op: '>='
    value: '18'
    width: 1
- id: ts-eslint
  text: typescript-eslint 8.x requires TypeScript below 6.1
  requires:
  - key: fe-typescript
    op: <
    value: '6.1'
    width: 2
- id: next-patched
  text: Next.js below 16.4.1 is vulnerable to a Critical RCE
  requires:
  - key: fe-next
    op: '>='
    value: 16.4.1
- id: node-for-prisma
  text: Prisma 7 needs Node 20.19 or newer
  requires:
  - key: nodejs
    op: '>='
    value: '20.19'
- id: python-uv-managed
  text: Open WebUI via pip needs Python below 3.13; use uvx --python 3.12
  requires:
  - key: python
    op: '>='
    value: '3.12'
    width: 2
