# versions.yaml: single source of truth for every version the docs state.
#
# Prose references these through markers, never by retyping the number:
#   <!-- v:hyprland -->0.56.2<!-- /v -->        (field `target`)
#   <!-- v:hyprland:upstream -->0.57.0<!-- /v -->
# `python tools/render_versions.py` rewrites marker text from this file and
# `python tools/check_versions.py` fails CI if they differ. `check_versions.py
# --live` compares targets with Arch, CachyOS, AUR, npm and PyPI each week.
# Frozen history (snapshots, benchmark records) is marked <!-- snapshot: DATE -->
# and is exempt.

schema: 1
as_of: '2026-10-29'
policy: Latest stable that Arch/CachyOS repos or the official installer can deliver. CachyOS repos come first in pacman order, so the CachyOS version wins when both exist. Upstream is recorded alongside.
  Security fixes override the distro lag (see entry support notes).
