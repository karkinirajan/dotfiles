# =============================================================================
#  manifest.conf — what install.sh links where
#
#  Format:  <type>  <repo path>  <live path>
#  Blank lines and # comments ignored. ~ expands to $HOME.
#
#  Types:
#    link  symlink live -> repo. The repo is the single source of truth; editing
#          either path edits the same file, so drift is impossible. An existing
#          real file is backed up to <path>.bak-<timestamp> before replacing.
#
#    seed  copy repo -> live ONLY if live is missing. Never overwrites, never
#          links. For files another program rewrites at runtime, where a
#          symlink would either push machine state into git on every change or
#          be destroyed outright by a replace-style write. The repo copy can go
#          stale, so `./install.sh status` flags a seeded file whose live
#          version has changed and `./install.sh pull` copies it back in.
#
#  Linking a DIRECTORY (rather than each file) means new files added live are
#  picked up by the repo automatically. Good for config/ and scripts/ trees.
#  Use per-file links where the live directory also holds junk we don't track.
#
#  Paths are chapter-relative: see the part folders listed in README.md.
# =============================================================================

# ── 03 Terminal ──────────────────────────────────────────────────────────────
link  03-terminal/zsh/.zshrc                       ~/.zshrc
link  03-terminal/starship/starship.toml           ~/.config/starship.toml

# Kitty: per-file, not the whole dir. The live kitty dir also holds
# current-theme.conf (generated by the nightlight theme-sync script) plus old
# .bak files. current-theme.conf is NOT tracked — see .gitignore.
link  03-terminal/kitty/kitty.conf                 ~/.config/kitty/kitty.conf
link  03-terminal/kitty/catppuccin-mocha.conf      ~/.config/kitty/catppuccin-mocha.conf
link  03-terminal/kitty/gruvbox-dark-hard.conf     ~/.config/kitty/gruvbox-dark-hard.conf
link  03-terminal/kitty/psql-mode.conf             ~/.config/kitty/psql-mode.conf

# fzf preview helper used by the tracked zsh configuration.
link  03-terminal/fzf/preview.sh                   ~/.config/fzf/preview.sh

# Alacritty: only the main config is tracked. themes/noctalia.toml is NOT —
# `alacritty` is one of Noctalia's theme templates, so that file is rewritten
# every time the palette changes. alacritty.toml imports it and defines no
# colours of its own, which is what keeps the two from fighting.
link  03-terminal/alacritty/alacritty.toml         ~/.config/alacritty/alacritty.toml

# ── 02 Desktop: Hyprland ─────────────────────────────────────────────────────
link  02-desktop/hyprland/hypr/hyprland.conf       ~/.config/hypr/hyprland.conf
link  02-desktop/hyprland/hypr/hypridle.conf       ~/.config/hypr/hypridle.conf
link  02-desktop/hyprland/hypr/hyprlock.conf       ~/.config/hypr/hyprlock.conf
link  02-desktop/hyprland/hypr/config              ~/.config/hypr/config
link  02-desktop/hyprland/hypr/scripts             ~/.config/hypr/scripts
# UWSM session environment: browser default and toolkit variables.
link  02-desktop/hyprland/uwsm/env                 ~/.config/uwsm/env
link  02-desktop/hyprland/hyprland-shortcuts.md     ~/hyprland-shortcuts.md

# hyprpaper and WallRizz were both removed 2026-09-06: they fought Noctalia's
# own wallpaper layer for the same background slot. Noctalia is the single
# wallpaper source of truth now, so hyprpaper.conf was removed.

# ── 02 Desktop: Noctalia shell (bar / launcher / control-center / notifications)
# settings.toml is SEEDED, not linked. Noctalia rewrites the whole file itself
# (schema migrations on upgrade, and every change made through its settings
# GUI). Since June 2026 its writes go through symlinks (verified in the 5.4.0
# source), so a link would survive; the file stays a seed because it also holds
# machine state (wallpaper paths, favorites, home paths) that should not flow
# back into git on every change. Seeding keeps the repo copy a real file;
# `./install.sh status` reports when live has moved ahead and `./install.sh pull`
# brings the change in as a git diff.
#
# This is not hypothetical: the 5.0.1 upgrade (config_version 14) reset the bar
# to stock defaults — border colours, border_width, font_family, font_weight,
# icon_color, widget_spacing and the margins all went back to factory values,
# and it went unnoticed because nothing compared the two.
seed  02-desktop/hyprland/noctalia/state/settings.toml  ~/.local/state/noctalia/settings.toml

# Palettes are hand-written and Noctalia only ever reads them, so they link.
link  02-desktop/hyprland/noctalia/palettes        ~/.config/noctalia/palettes

# D-Bus override silencing mako so Noctalia owns org.freedesktop.Notifications.
link  02-desktop/hyprland/noctalia/dbus-override/fr.emersion.mako.service  ~/.local/share/dbus-1/services/fr.emersion.mako.service

# ── 02 Desktop: Fonts ────────────────────────────────────────────────────────
# Font *files* are not tracked — they come from packages (see
# 01-system/cachyos/packages/fonts.txt). Only the rendering rules live here.
link  02-desktop/fonts/fontconfig/fonts.conf       ~/.config/fontconfig/fonts.conf

# ── 05 AI: Ollama ────────────────────────────────────────────────────────────
# Deliberately NOT listed. All of the following need root and install.sh runs
# unprivileged, so they're kept as plain files and copied/installed by hand —
# see 05-ai/ollama/README.md for exact commands:
#   - systemd drop-ins (05-ai/ollama/systemd/*.conf) -> /etc/systemd/system/
#     ollama.service.d/
#   - the ollama-backend {vulkan|rocm} helper (05-ai/ollama/bin/ollama-backend)
#     -> /usr/local/sbin/ollama-backend
#   - the cap_perfmon pacman hook (05-ai/ollama/systemd/ollama-setcap.hook)
#     -> /etc/pacman.d/hooks/
# 05-ai/ollama/claude-code-bench/ (local models wired into Claude Code as
# ccl/cclf) is plain data/scripts, no root involved — still not linked since
# it is a working area, not config to symlink.

# ── 05 AI: Claude Code (global, non-project) ─────────────────────────────────
link  05-ai/claude-code/CLAUDE.md                  ~/.claude/CLAUDE.md
link  05-ai/claude-code/settings.json              ~/.claude/settings.json
link  05-ai/claude-code/agents                     ~/.claude/agents
link  05-ai/claude-code/skills                     ~/.claude/skills
link  05-ai/claude-code/commands                   ~/.claude/commands

# ── 06 Tools: focus (distraction blocker) ────────────────────────────────────
# Lists are linked on purpose: what you block is worth versioning. Runtime
# state (state, lock, logs/, stats/) is never tracked.
link  06-tools/focus/scripts                       ~/focus/scripts
link  06-tools/focus/allow.list                    ~/focus/allow.list
link  06-tools/focus/block.list                    ~/focus/block.list
link  06-tools/focus/schedule.conf                 ~/focus/schedule.conf

# ── 01 System: topgrade (one-command update-everything) ──────────────────────
# See 01-system/topgrade/README.md for what's disabled and why.
link  01-system/topgrade/topgrade.toml             ~/.config/topgrade.toml

# ── 04 Editors ───────────────────────────────────────────────────────────────
link  04-editors/zed/settings.json                 ~/.config/zed/settings.json

# VS Code rewrites both files whole on every settings-UI change, same class of
# problem as Noctalia above — seeded, not linked, so `status`/`pull` track it.
seed  04-editors/vscode/vscode-settings.json       ~/.config/Code/User/settings.json
seed  04-editors/vscode/vscode-keybindings.json    ~/.config/Code/User/keybindings.json
