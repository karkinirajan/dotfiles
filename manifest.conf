# =============================================================================
#  manifest.conf — what install.sh links where
#
#  Format:  <type>  <repo path>  <live path>
#  Blank lines and # comments ignored. ~ expands to $HOME.
#
#  Types:
#    link  symlink live -> repo. The repo is the single source of truth; editing
#          either path edits the same file, so drift is impossible. An existing
#          real file is backed up to <path>.bak-<timestamp> before replacing.
#
#    seed  copy repo -> live ONLY if live is missing. Never overwrites, never
#          links. For files another program rewrites at runtime — a symlink
#          there would push machine state into git on every change.
#
#  Linking a DIRECTORY (rather than each file) means new files added live are
#  picked up by the repo automatically. Good for config/ and scripts/ trees.
#  Use per-file links where the live directory also holds junk we don't track.
# =============================================================================

# ── Shell ────────────────────────────────────────────────────────────────────
link  terminal/zsh/.zshrc                     ~/.zshrc
link  terminal/starship/starship.toml         ~/.config/starship.toml

# ── Terminal ─────────────────────────────────────────────────────────────────
# Per-file, not the whole dir: the live kitty dir also holds current-theme.conf
# (regenerated by shipwright.nvim to mirror Neovim's colorscheme) plus old
# .bak files. current-theme.conf is deliberately NOT tracked — see .gitignore.
link  terminal/kitty/kitty.conf               ~/.config/kitty/kitty.conf
link  terminal/kitty/catppuccin-mocha.conf    ~/.config/kitty/catppuccin-mocha.conf
link  terminal/kitty/gruvbox-dark-hard.conf   ~/.config/kitty/gruvbox-dark-hard.conf

# ── Hyprland ─────────────────────────────────────────────────────────────────
link  wm/hyprland/hypr/hyprland.conf          ~/.config/hypr/hyprland.conf
link  wm/hyprland/hypr/hypridle.conf          ~/.config/hypr/hypridle.conf
link  wm/hyprland/hypr/hyprlock.conf          ~/.config/hypr/hyprlock.conf
link  wm/hyprland/hypr/config                 ~/.config/hypr/config
link  wm/hyprland/hypr/scripts                ~/.config/hypr/scripts

# WallRizz rewrites hyprpaper.conf wholesale on every wallpaper change, so a
# symlink would dirty git each time. Seeded as a starting default instead.
seed  wm/hyprland/hypr/hyprpaper.conf         ~/.config/hypr/hyprpaper.conf

# ── Claude Code (global, non-project) ────────────────────────────────────────
link  tools/claude/CLAUDE.md                  ~/.claude/CLAUDE.md
link  tools/claude/settings.json              ~/.claude/settings.json
link  tools/claude/agents                     ~/.claude/agents
link  tools/claude/commands                   ~/.claude/commands
link  tools/claude/skills                     ~/.claude/skills

# ── focus (distraction blocker) ──────────────────────────────────────────────
# Lists are linked on purpose: what you block is worth versioning. Runtime
# state (state, lock, logs/, stats/) is never tracked.
link  tools/focus/scripts                     ~/focus/scripts
link  tools/focus/allow.list                  ~/focus/allow.list
link  tools/focus/block.list                  ~/focus/block.list
link  tools/focus/schedule.conf               ~/focus/schedule.conf

# ── Editors ──────────────────────────────────────────────────────────────────
link  editors/zed/settings.json               ~/.config/zed/settings.json
