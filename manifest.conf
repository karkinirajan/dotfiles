# =============================================================================
#  manifest.conf — what install.sh links where
#
#  Format:  <type>  <repo path>  <live path>
#  Blank lines and # comments ignored. ~ expands to $HOME.
#
#  Types:
#    link  symlink live -> repo. The repo is the single source of truth; editing
#          either path edits the same file, so drift is impossible. An existing
#          real file is backed up to <path>.bak-<timestamp> before replacing.
#
#    seed  copy repo -> live ONLY if live is missing. Never overwrites, never
#          links. For files another program rewrites at runtime, where a
#          symlink would either push machine state into git on every change or
#          be destroyed outright by a replace-style write. The repo copy can go
#          stale, so `./install.sh status` flags a seeded file whose live
#          version has changed and `./install.sh pull` copies it back in.
#
#  Linking a DIRECTORY (rather than each file) means new files added live are
#  picked up by the repo automatically. Good for config/ and scripts/ trees.
#  Use per-file links where the live directory also holds junk we don't track.
# =============================================================================

# ── Shell ────────────────────────────────────────────────────────────────────
link  terminal/zsh/.zshrc                     ~/.zshrc
link  terminal/starship/starship.toml         ~/.config/starship.toml

# ── Terminal ─────────────────────────────────────────────────────────────────
# Per-file, not the whole dir: the live kitty dir also holds current-theme.conf
# (regenerated by shipwright.nvim to mirror Neovim's colorscheme) plus old
# .bak files. current-theme.conf is deliberately NOT tracked — see .gitignore.
link  terminal/kitty/kitty.conf               ~/.config/kitty/kitty.conf
link  terminal/kitty/catppuccin-mocha.conf    ~/.config/kitty/catppuccin-mocha.conf
link  terminal/kitty/gruvbox-dark-hard.conf   ~/.config/kitty/gruvbox-dark-hard.conf

# Alacritty: only the main config is tracked. themes/noctalia.toml is NOT —
# `alacritty` is one of Noctalia's theme templates, so that file is rewritten
# every time the palette changes. alacritty.toml imports it and defines no
# colours of its own, which is what keeps the two from fighting.
link  terminal/alacritty/alacritty.toml       ~/.config/alacritty/alacritty.toml

# ── Hyprland ─────────────────────────────────────────────────────────────────
link  wm/hyprland/hypr/hyprland.conf          ~/.config/hypr/hyprland.conf
link  wm/hyprland/hypr/hypridle.conf          ~/.config/hypr/hypridle.conf
link  wm/hyprland/hypr/hyprlock.conf          ~/.config/hypr/hyprlock.conf
link  wm/hyprland/hypr/config                 ~/.config/hypr/config
link  wm/hyprland/hypr/scripts                ~/.config/hypr/scripts

# hyprpaper and WallRizz were both removed 2026-09-06: they fought Noctalia's
# own wallpaper layer for the same background slot. Noctalia is the single
# wallpaper source of truth now, so hyprpaper.conf is no longer installed.
# The file is kept in the repo for reference only.

# ── Noctalia shell (bar / launcher / control-center / notifications) ──────────
# settings.toml is SEEDED, not linked. Noctalia rewrites the whole file itself
# (schema migrations on upgrade, and every change made through its settings
# GUI), and a rewrite that replaces the file rather than editing in place would
# silently destroy a symlink — leaving the repo tracking nothing. Seeding keeps
# the repo copy a real file; `./install.sh status` reports when live has moved
# ahead and `./install.sh pull` brings the change in as a git diff.
#
# This is not hypothetical: the 5.0.1 upgrade (config_version 14) reset the bar
# to stock defaults — border colours, border_width, font_family, font_weight,
# icon_color, widget_spacing and the margins all went back to factory values,
# and it went unnoticed because nothing compared the two.
seed  wm/hyprland/noctalia/state/settings.toml  ~/.local/state/noctalia/settings.toml

# Palettes are hand-written and Noctalia only ever reads them, so they link.
link  wm/hyprland/noctalia/palettes             ~/.config/noctalia/palettes

# ── Fonts ────────────────────────────────────────────────────────────────────
# Font *files* are not tracked — they come from packages (see
# os/cachyos/packages/fonts.txt). Only the rendering rules live here.
link  fonts/fontconfig/fonts.conf             ~/.config/fontconfig/fonts.conf

# ── Ollama ───────────────────────────────────────────────────────────────────
# Deliberately NOT listed. All of the following need root and install.sh runs
# unprivileged, so they're kept as plain files and copied/installed by hand —
# see tools/ollama/README.md for exact commands:
#   - systemd drop-ins (tools/ollama/systemd/*.conf) -> /etc/systemd/system/
#     ollama.service.d/
#   - the ollama-backend {vulkan|rocm} helper (tools/ollama/bin/ollama-backend)
#     -> /usr/local/sbin/ollama-backend
#   - the cap_perfmon pacman hook (tools/ollama/systemd/ollama-setcap.hook)
#     -> /etc/pacman.d/hooks/
# tools/ollama/claude-code-bench/ (local models wired into Claude Code as
# ccl/cclf) is plain data/scripts under this same tree, no root involved —
# still not linked since it's a working area, not config to symlink.
#
# ── Claude Code (global, non-project) ────────────────────────────────────────
link  tools/claude/CLAUDE.md                  ~/.claude/CLAUDE.md
link  tools/claude/settings.json              ~/.claude/settings.json
link  tools/claude/agents                     ~/.claude/agents
link  tools/claude/commands                   ~/.claude/commands
link  tools/claude/skills                     ~/.claude/skills

# ── focus (distraction blocker) ──────────────────────────────────────────────
# Lists are linked on purpose: what you block is worth versioning. Runtime
# state (state, lock, logs/, stats/) is never tracked.
link  tools/focus/scripts                     ~/focus/scripts
link  tools/focus/allow.list                  ~/focus/allow.list
link  tools/focus/block.list                  ~/focus/block.list
link  tools/focus/schedule.conf               ~/focus/schedule.conf

# ── topgrade (one-command update-everything) ─────────────────────────────────
# See tools/topgrade/README.md for what's disabled and why.
link  tools/topgrade/topgrade.toml            ~/.config/topgrade.toml

# ── Editors ──────────────────────────────────────────────────────────────────
link  editors/zed/settings.json               ~/.config/zed/settings.json
