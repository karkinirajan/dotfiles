[General]
# x11-user, not wayland: the Wayland greeter needs `weston --shell=kiosk` and
# weston is not installed, so every single boot logged
#   Failed to start "weston --shell=kiosk": execve: No such file or directory
#   Greeter stopped. SDDM::Auth::HELPER_DISPLAYSERVER_ERROR
#   Failed to launch the display server, falling back to DisplayServer=x11-user
# Naming the fallback directly removes a guaranteed failure on every login.
# Install weston and set this back to `wayland` if a Wayland greeter is wanted.
DisplayServer=x11-user

# Session presets the entry in /usr/share/wayland-sessions/. It is
# hyprland.desktop (/usr/bin/start-hyprland) — what actually launches — not
# hyprland-uwsm.desktop, which was set here before and never matched.
# No User= is set, so this is only the default highlighted session, NOT
# passwordless autologin.
[Autologin]
Session=hyprland.desktop
