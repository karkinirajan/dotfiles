# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                 CachyOS Hyprland Configuration              ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

$mainMod = SUPER

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                         Source Files                        ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
source = ~/.config/hypr/config/animations.conf
source = ~/.config/hypr/config/autostart.conf
source = ~/.config/hypr/config/decorations.conf
source = ~/.config/hypr/config/environment.conf
source = ~/.config/hypr/config/input.conf
source = ~/.config/hypr/config/keybinds.conf
source = ~/.config/hypr/config/monitor.conf
source = ~/.config/hypr/config/plugins.conf
source = ~/.config/hypr/config/variables.conf
source = ~/.config/hypr/config/windowrules.conf

# Modifying these configs can be done by creating a user defined config in the home directory, e.g.
## ~/.config/hypr/config/user-config.conf
# source = ~/.config/hypr/config/user-config.conf


# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf

# ── Diagnostics: session dies exactly 90s after login ────────────────────────
# Since the hyprland 0.56.2-2.1 -> 0.56.2-3.1 upgrade on 2026-09-13, the first
# one or two logins after a reboot end after exactly 90-91 seconds, dropping
# back to SDDM; a later attempt sticks. sddm-helper reports exit 2 with no
# coredump and no crash report, i.e. Hyprland exits rather than crashes.
# Ruled out by inspection: OOM, amdgpu reset/hang (no kernel events at the
# kill), hyprpm plugin ABI (no plugins are loaded at all), the auto pacman
# runs, greeter-session teardown, and hypridle (300s, and it locks not exits).
# Hyprland truncates its own log by default, which hides the exit reason, so
# keep full logs until this is identified.
debug {
    disable_logs = false
}
