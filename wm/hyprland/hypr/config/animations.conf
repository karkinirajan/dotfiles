# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Animations Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# https://wiki.hyprland.org/Configuring/Animations/

animations {
    enabled = yes
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windowsIn, 1, 4, overshot, slide
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 5, default
    animation = workspacesIn, 1, 6, overshot, slide
    animation = workspacesOut, 1, 6, overshot, slidefade 80%

    # hyprfocus plugin animations — snappy flash in, slightly slower fade
    # out, matching the existing "default" curve speed used for window
    # borders (line 12) rather than the plugin's own slower factory
    # default. Commented out 2026-09-04: `hyprctl plugin list` shows no
    # plugins loaded at all right now ("no plugins will be loaded until
    # every repository updates successfully" — hyprpm update shows
    # Hyprland's plugin ABI changed and 4 of 5 plugin repos
    # (hyprland-plugins incl. hyprfocus, Hyprspace, hy3, dynamic-cursors)
    # fail to build against it; only split-monitor-workspaces still
    # builds). Referencing an animation name a not-currently-loaded
    # plugin would register is a hard config error ("no such animation"),
    # not a silent no-op. Re-enable once hyprfocus itself is rebuilt
    # working again — see plugins.conf's hyprfocus block for the same
    # note.
    # animation = hyprfocusIn, 1, 2, default
    # animation = hyprfocusOut, 1, 3, default
}
