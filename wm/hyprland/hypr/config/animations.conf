# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Animations Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# https://wiki.hyprland.org/Configuring/Animations/

animations {
    enabled = yes
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windowsIn, 1, 4, overshot, slide
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 5, default
    animation = workspacesIn, 1, 6, overshot, slide
    animation = workspacesOut, 1, 6, overshot, slidefade 80%

    # hyprfocus plugin — snappy flash in, slightly slower fade out, matching
    # the existing "default" curve speed used for window borders (line 12)
    # rather than the plugin's own slower factory default.
    #
    # Was briefly commented out 2026-09-04 after `hyprctl plugin list`
    # showed no plugins loaded (a stale headersRoot cache right after a
    # pacman Hyprland 0.56.2-1 -> 0.56.2-2.1 bump — hyprpm's commit_pins
    # for each plugin already target the correct Hyprland-compatible
    # commit, but the build needs current headers to succeed). Confirmed
    # via `hyprctl plugin list` all 6 plugins loaded again after headers
    # regenerated on a subsequent hyprpm update; re-enabled.
    animation = hyprfocusIn, 1, 2, default
    animation = hyprfocusOut, 1, 3, default
}
