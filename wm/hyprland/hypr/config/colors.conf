# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃              Colors Configuration — Shades of Jade            ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Palette source: https://github.com/HANCORE-linux/omarchy-shadesofjade-theme
# This is the single source of truth for the accent/base colors used across
# Hyprland and hyprlock — kept as the same Catppuccin-shaped role names so
# every reference below stays valid, just recolored to Shades of Jade.
# Noctalia (bar/dmenu/search/launcher/control-center) is themed separately
# via ~/.config/noctalia/palettes/ShadesOfJade.json (custom_palette).

$rosewater = rgba(FFF7F2ff)
$flamingo  = rgba(FFF7F2ff)
$pink      = rgba(E25F4Bff)
$mauve     = rgba(cba6f7ff)
$red       = rgba(ff3370ff)
$maroon    = rgba(ff3370ff)
$peach     = rgba(FF6600ff)
$yellow    = rgba(D1FFb0ff)
$green     = rgba(00a86bff)
$teal      = rgba(80d4b5ff)
$sky       = rgba(80d4b5ff)
$sapphire  = rgba(00a86bff)
$blue      = rgba(00a86bff)
$lavender  = rgba(89b4faff)

$text      = rgba(e6f6f0ff)
$subtext1  = rgba(c4d4ceff)
$subtext0  = rgba(a1b1abff)
$overlay2  = rgba(7e8f89ff)
$overlay1  = rgba(61716bff)
$overlay0  = rgba(4a5a54ff)
$surface2  = rgba(466d58ff)
$surface1  = rgba(2b4c3bff)
$surface0  = rgba(1c372aff)
$base      = rgba(00110bff)
$mantle    = rgba(000806ff)
$crust     = rgba(000000ff)

# Dimmed accent for inactive window borders (same accent, lower alpha —
# dimmed further than before; active border stays at full brightness)
$blue_dim  = rgba(cba6f726)

# Primary accent used everywhere: active workspace, active border, power
# button. Shades of Jade's signature jade-green, matching the theme's own
# Hyprland active-border gradient start color. Solid, full alpha.
$ctp_accent = $mauve
