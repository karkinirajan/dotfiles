# General
# Alacritty is the default terminal (2026-09-15). kitty is still installed and
# fully configured — swap these two lines back to return to it. Both share the
# same font, padding, cursor, opacity and clipboard keys, so the switch is not
# visible; see terminal/alacritty/SHORTCUTS.md for what differs (Alacritty has
# no tabs or splits, so that work moves to Hyprland or tmux).
$filemanager = alacritty -e yazi
$applauncher = ~/.config/hypr/scripts/launcher-open.sh
$terminal = alacritty

# Screenshots — grim + slurp + satty (see
# ~/.config/hypr/scripts/screenshot.sh for the full story: grimblast isn't
# installed anymore, and hyprshot was tried then removed after a flaky
# first-launch failure that was never root-caused)
$shot-region = ~/.config/hypr/scripts/screenshot.sh region
$shot-window = ~/.config/hypr/scripts/screenshot.sh window
$shot-screen = ~/.config/hypr/scripts/screenshot.sh screen

# WallRizz retired 2026-09-06 — replaced by Noctalia's own built-in
# wallpaper manager (see keybinds.conf's $mainMod+W / $mainMod+SHIFT+W and
# autostart.conf's note) since it was fighting Noctalia's wallpaper layer
# for the same background slot.