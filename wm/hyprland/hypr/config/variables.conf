# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Variables Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/colors.conf

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4
    border_size = 1
    # Shades of Jade's own active-border gradient: jade green -> pale lime.
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    # Same gradient as active, just dimmed (alpha ee -> 26) instead of a
    # different flat color, so inactive windows read as a quieter version
    # of the same accent rather than a visually distinct color.
    col.inactive_border = rgba(cba6f726) rgba(89b4fa26) 45deg
    layout = dwindle # master|dwindle

    # https://wiki.hyprland.org/Configuring/Variables/#snap
    snap {
        enabled = true
    }
}

# removed old gestures {} block — Hyprland 0.39+ uses gesture = … lines

# https://wiki.hyprland.org/Configuring/Variables/#group
group {
    col.border_active = $blue
    col.border_inactive = $surface1
    col.border_locked_active = $sapphire
    col.border_locked_inactive = $surface2

    # https://wiki.hyprland.org/Configuring/Variables/#groupbar
    groupbar {
        font_family = "DejaVu Sans"
        text_color = $crust
        col.active = $blue
        col.inactive = $surface1
        col.locked_active = $sapphire
        col.locked_inactive = $surface2
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    font_family = "DejaVu Sans"
    splash_font_family = "DejaVu Sans"
    disable_hyprland_logo = true
    col.splash = $blue
    background_color = $base
    enable_swallow = true
    swallow_regex = ^(nautilus|nemo|thunar|btrfs-assistant.)$
    focus_on_activate = true
    vrr = 2
}

# https://wiki.hyprland.org/Configuring/Variables/#render
render {
   direct_scanout = true
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    special_scale_factor = 0.8
    preserve_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
    special_scale_factor = 0.8
}

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Gestures                                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# 4-finger horizontal swipe to switch workspaces
gesture = 4, horizontal, workspace

# 3-finger swipe down closes active window
gesture = 3, down, close

# 3-finger swipe up toggles fullscreen
gesture = 3, up, fullscreen

# 3-finger swipe left toggles float/tile
gesture = 3, left, float
