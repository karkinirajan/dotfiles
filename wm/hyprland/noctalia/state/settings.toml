config_version = 14

[audio]
enable_overdrive = true
enable_sounds = true

[bar]
order = [ "kneeraazon" ]

    [bar.kneeraazon]
    border = "#cba6f7aa"
    border_width = 1.0
    capsule = true
    capsule_border = "#cba6f799"
    capsule_fill = "primary"
    capsule_opacity = 0.0
    capsule_padding = 10.0
    capsule_radius = 4
    capsule_thickness = 0.69999998807907104
    contact_shadow = true
    end = [
        "notifications",
        "clipboard",
        "volume",
        "network",
        "nightlight",
        "screen-time-btn",
        "weather",
        "tray",
        "felipeartur/ai-usagebar:bar",
        "tmelik/system-monitor:summary",
        "session"
    ]
    font_family = "DejaVu Sans"
    font_weight = 700
    margin_ends = 0
    padding = 8
    panel_overlap = 0
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    radius_top_left = 0
    radius_top_right = 0
    start = [ "workspaces", "group:g1" ]
    thickness = 42
    widget_spacing = 8

        [[bar.kneeraazon.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#CBA6F799"
        enabled = true
        fill = "primary"
        id = "g1"
        members = [ "active_window", "media", "audio_visualizer" ]
        opacity = 0.0
        padding = 10.0
        radius = 4.0

