# =============================================================================
#  ~/.config/kitty/kitty.conf — kneeraazon
#  CachyOS · KDE Plasma 6 · Wayland · Gruvbox Dark Hard
#
#  Pairs with ~/.zshrc (oh-my-zsh + starship/p10k toggle).
#  Reload in place:  ctrl+shift+f5      Debug config:  kitty --debug-config
#  Stock default kept at: kitty.conf.stock-backup
# =============================================================================

# ─── Fonts ────────────────────────────────────────────────────────────────────
# FiraCode Nerd Font Mono: programming ligatures + full Nerd Font glyph set,
# which is what starship / powerlevel10k need for their icons and separators.
font_family              FiraCode Nerd Font Mono
bold_font                FiraCode Nerd Font Mono SemiBold
italic_font              auto
bold_italic_font         auto
font_size                11.5

# Ligatures: keep them, but never under the cursor (so you can see what you edit)
disable_ligatures        cursor

# Cell metrics — uncomment and tweak if glyphs feel cramped or too airy
# modify_font            cell_height 105%
# modify_font            cell_width 100%

# Nerd Font symbol range — force these codepoints to resolve from the Nerd Font
# even if another font claims them (prevents tofu boxes in the prompt).
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 FiraCode Nerd Font Mono

# ─── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape             beam
cursor_beam_thickness    1.6
cursor_blink_interval    -1
cursor_stop_blinking_after 15.0
# Smooth cursor motion (kitty >= 0.36)
cursor_trail             3
cursor_trail_decay       0.1 0.4
cursor_trail_start_threshold 2

# ─── Scrollback ───────────────────────────────────────────────────────────────
scrollback_lines         20000
scrollback_pager         nvim -R -c 'set ft=man nomod nolist' -
scrollbar                scrolled-and-hovered
wheel_scroll_multiplier  3.0
touch_scroll_multiplier  1.0

# ─── Mouse ────────────────────────────────────────────────────────────────────
mouse_hide_wait          2.0
copy_on_select           no
strip_trailing_spaces    smart
focus_follows_mouse      no
default_pointer_shape    beam

# Open URLs with a single ctrl+click
url_style                curly
open_url_with            default
detect_urls              yes
underline_hyperlinks     hover

# ─── Performance ──────────────────────────────────────────────────────────────
# repaint_delay 8 ≈ 120fps ceiling; sync_to_monitor kills tearing on Wayland.
repaint_delay            8
input_delay              1
sync_to_monitor          yes

# ─── Bell ─────────────────────────────────────────────────────────────────────
enable_audio_bell        no
visual_bell_duration     0.0
window_alert_on_bell     yes
bell_on_tab              "🔔 "

# ─── Window layout ────────────────────────────────────────────────────────────
remember_window_size     yes
initial_window_width     1200
initial_window_height    750
window_padding_width     10
window_border_width      1pt
draw_minimal_borders     yes
placement_strategy       center
hide_window_decorations  no
confirm_os_window_close  1
enabled_layouts          splits:split_axis=horizontal,stack,tall,fat,grid

# ─── Tab bar ──────────────────────────────────────────────────────────────────
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         2
tab_activity_symbol      " ● "
tab_title_template       "{index}: {title}"
active_tab_font_style    bold
inactive_tab_font_style  normal

# ─── Colours ──────────────────────────────────────────────────────────────────
# Catppuccin Mocha, matching the system-wide theme. Note: shipwright.nvim
# auto-generates current-theme.conf (included further below, in the
# BEGIN/END_KITTY_THEME block) to mirror Neovim's active colorscheme — that
# include comes LAST and wins, so it's the one that actually needs to stay
# on a Catppuccin variant for kitty to render Catppuccin; set Neovim's
# colorscheme to a catppuccin flavor so shipwright regenerates it to match.
include                  catppuccin-mocha.conf

background_opacity       0.88
dynamic_background_opacity yes

# ─── Shell integration ────────────────────────────────────────────────────────
# Powers jump-to-prompt (ctrl+shift+z/x), cwd inheritance in new tabs/splits,
# and command-output selection. Works with zsh out of the box.
shell_integration        enabled

# ─── Wayland / KDE ────────────────────────────────────────────────────────────
# wayland_titlebar_color   background
linux_display_server     auto

# ─── Misc ─────────────────────────────────────────────────────────────────────
allow_remote_control     yes
listen_on                unix:@mykitty
update_check_interval    0
clipboard_control        write-clipboard write-primary read-clipboard read-primary
term                     xterm-kitty

# =============================================================================
#  Keybindings
# =============================================================================
kitty_mod                ctrl+shift

# ── Clipboard ────────────────────────────────────────────────────────────────
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard
map shift+insert         paste_from_selection

# ── Font size ────────────────────────────────────────────────────────────────
map ctrl+equal           change_font_size all +0.5
map ctrl+plus            change_font_size all +0.5
map ctrl+minus           change_font_size all -0.5
map ctrl+0               change_font_size all 0

# ── Tabs ─────────────────────────────────────────────────────────────────────
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+q         close_tab
map ctrl+shift+right     next_tab
map ctrl+shift+left      previous_tab
map ctrl+shift+.         move_tab_forward
map ctrl+shift+,         move_tab_backward
map ctrl+shift+alt+t     set_tab_title
map alt+1                goto_tab 1
map alt+2                goto_tab 2
map alt+3                goto_tab 3
map alt+4                goto_tab 4
map alt+5                goto_tab 5

# ── Splits (windows) ─────────────────────────────────────────────────────────
map ctrl+shift+enter     launch --location=hsplit --cwd=current
map ctrl+shift+\         launch --location=vsplit --cwd=current
map ctrl+shift+w         close_window
map ctrl+shift+]         next_window
map ctrl+shift+[         previous_window

# Navigate splits with alt+hjkl (vim-style)
map alt+h                neighboring_window left
map alt+j                neighboring_window down
map alt+k                neighboring_window up
map alt+l                neighboring_window right

# Resize splits
map ctrl+alt+h           resize_window narrower 3
map ctrl+alt+j           resize_window shorter 3
map ctrl+alt+k           resize_window taller 3
map ctrl+alt+l           resize_window wider 3
map ctrl+alt+0           resize_window reset

map ctrl+shift+f5        load_config_file
map ctrl+shift+f6        debug_config

# ── Scrollback ───────────────────────────────────────────────────────────────
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end
map ctrl+shift+h         show_scrollback

# Jump between prompts (needs shell_integration, which is on above)
map ctrl+shift+z         scroll_to_prompt -1
map ctrl+shift+x         scroll_to_prompt 1
# Pipe the last command's output into nvim
map ctrl+shift+g         show_last_command_output

# ── Hints kitten: grab things off the screen without the mouse ───────────────
map ctrl+shift+e         open_url_with_hints
map ctrl+shift+p>f       kitten hints --type path --program -
map ctrl+shift+p>l       kitten hints --type line --program -
map ctrl+shift+p>w       kitten hints --type word --program -
map ctrl+shift+p>h       kitten hints --type hash --program -

# ── Background opacity, live ─────────────────────────────────────────────────
map ctrl+shift+a>m       set_background_opacity +0.05
map ctrl+shift+a>l       set_background_opacity -0.05
map ctrl+shift+a>1       set_background_opacity 1.0

# ── Misc ─────────────────────────────────────────────────────────────────────
map ctrl+shift+u         kitten unicode_input
map ctrl+shift+f2        edit_config_file
map ctrl+shift+escape    kitty_shell window


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
