# =============================================================================
#  ~/.config/starship.toml — kneeraazon
#  Gruvbox Dark Hard · Two-line box-drawing · Fill separator
# =============================================================================

add_newline = true

# ── Left prompt ───────────────────────────────────────────────────────────────
# Line 1: ╭─ [os] [user] [dir] [git] [langs] [devops] [status] [duration] ─── [jobs] [time]
# Line 2: ╰─❯
format = """
[╭─](fg:#665c54)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$python\
$conda\
$nodejs\
$bun\
$deno\
$rust\
$golang\
$java\
$docker_context\
$kubernetes\
$aws\
$terraform\
$direnv\
$status\
$cmd_duration\
$fill\
$memory_usage\
$jobs\
$time\
$line_break\
[╰─](fg:#665c54)\
$character"""

right_format = ""

# ── OS ────────────────────────────────────────────────────────────────────────
[os]
disabled = false
style    = "bold fg:#fb4934"
format   = "[$symbol]($style) "

[os.symbols]
Arch    = " "
CachyOS = " "
Unknown = " "

# ── User ──────────────────────────────────────────────────────────────────────
[username]
show_always = true
style_user  = "bold fg:#b8bb26"
style_root  = "bold fg:#fb4934"
format      = "[$user]($style) "

[hostname]
ssh_only = true
style    = "bold fg:#83a598"
format   = "[@$hostname]($style) "

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
style             = "bold fg:#fe8019"
read_only         = " 󰌾"
truncation_length = 4
truncate_to_repo  = true
format            = "[$path]($style)[$read_only](fg:#fb4934) "

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "bold fg:#d3869b"
format = "[$symbol$branch]($style) "

[git_status]
style     = "fg:#fabd2f"
ahead     = "⬆${count}"
behind    = "⬇${count}"
diverged  = "⬆${ahead_count}⬇${behind_count}"
untracked = "?${count}"
stashed   = "≡"
modified  = "!${count}"
staged    = "+${count}"
renamed   = "»${count}"
deleted   = "✘${count}"
format    = "([$all_status$ahead_behind]($style) )"

# ── Languages ─────────────────────────────────────────────────────────────────
[python]
symbol = " "
style  = "fg:#fabd2f"
format = "[$symbol($version )($virtualenv )]($style)"

[nodejs]
symbol = " "
style  = "fg:#b8bb26"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style  = "fg:#fe8019"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style  = "fg:#83a598"
format = "[$symbol($version )]($style)"

# ── DevOps ────────────────────────────────────────────────────────────────────
[docker_context]
symbol = " "
style  = "fg:#83a598"
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
symbol   = "☸ "
style    = "fg:#7dcfff"
format   = "[$symbol$context( \\($namespace\\))]($style) "

# ── Timing ────────────────────────────────────────────────────────────────────
[cmd_duration]
min_time          = 2_000
style             = "fg:#928374"
show_milliseconds = false
format            = "[󱎫 $duration]($style) "

# ── Fill + time ───────────────────────────────────────────────────────────────
[fill]
symbol = "─"
style  = "fg:#3c3836"

[time]
disabled    = false
style       = "fg:#665c54"
time_format = "%H:%M"
format      = "[ $time]($style)"

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold fg:#b8bb26)"
error_symbol   = "[❯](bold fg:#fb4934)"
vimcmd_symbol  = "[❮](bold fg:#d3869b)"

[line_break]
disabled = false

[package]
disabled = true

# ── Git metrics (show +/- line counts) ───────────────────────────────────────
[git_metrics]
disabled         = false
added_style      = "fg:#b8bb26"
deleted_style    = "fg:#fb4934"
only_nonzero_diffs = true
format           = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# ── Extra languages ───────────────────────────────────────────────────────────
[java]
symbol   = " "
style    = "fg:#fb4934"
format   = "[$symbol($version )]($style)"

[bun]
symbol   = " "
style    = "fg:#fabd2f"
format   = "[$symbol($version )]($style)"

[deno]
symbol   = "🦕 "
style    = "fg:#83a598"
format   = "[$symbol($version )]($style)"

[conda]
symbol   = " "
style    = "fg:#b8bb26"
ignore_base = true
format   = "[$symbol$environment ]($style)"

# ── Cloud / IaC ───────────────────────────────────────────────────────────────
[aws]
symbol   = " "
style    = "fg:#fe8019"
format   = '[$symbol($profile )(\($region\) )]($style)'
disabled = false

[terraform]
symbol   = "󱁢 "
style    = "fg:#d3869b"
format   = "[$symbol$workspace ]($style)"
disabled = false

# ── Shell state ───────────────────────────────────────────────────────────────
[jobs]
symbol            = " "
style             = "fg:#83a598"
number_threshold  = 1
format            = "[$symbol$number]($style) "

[status]
disabled          = false
symbol            = "✖ "
not_executable_symbol = " "
not_found_symbol  = "󰍉 "
sigint_symbol     = " "
signal_symbol     = "⚡"
style             = "fg:#fb4934"
map_symbol        = true
format            = "[$symbol$common_meaning$signal_name$maybe_int]($style) "
pipestatus        = true

# ── Item 7: Memory usage (shows when RAM > 70%) ───────────────────────────────
[memory_usage]
disabled          = false
threshold         = 70
symbol            = "󰍛 "
style             = "fg:#fb4934"
format            = "[$symbol${ram}]($style) "

# ── Item 9: direnv — shows lock icon when .envrc is active/blocked ────────────
[direnv]
disabled          = false
loaded_msg        = "󱄑"
unloaded_msg      = "󱄒"
allowed_msg       = ""
denied_msg        = "󰌾"
format            = "[$symbol$loaded/$allowed]($style) "
style             = "fg:#8ec07c"
