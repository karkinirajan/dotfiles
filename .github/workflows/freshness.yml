name: freshness

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r tools/requirements.txt
      - name: Versions are not behind upstream, Arch, CachyOS, AUR or registries
        run: python tools/check_versions.py --live | tee freshness-versions.txt
      - name: Package names still exist (Arch, CachyOS, AUR)
        run: >
          python tools/pkg_lookup.py --lists 01-system/cachyos/packages/*.txt 06-tools/focus/packages.txt
          -o freshness-packages.csv
      - name: External links
        run: python tools/check_links.py --external | tee freshness-links.txt
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: freshness-report
          path: freshness-*.*
