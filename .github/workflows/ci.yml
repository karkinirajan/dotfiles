name: ci

on:
  push:
    branches: [master, "modernize/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh shellcheck
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.24.0
      - name: Links (relative paths and anchors)
        run: python tools/check_links.py
      - name: Version drift (versions.yaml vs markers and constraints)
        run: python tools/check_versions.py
      - name: Generated index is current
        run: python tools/gen_index.py --check
      - name: Style (no em dashes, frontmatter)
        run: python tools/check_style.py
      - name: Config files parse
        run: python tools/check_configs.py
      - name: Python lint
        run: ruff check tools
      - name: Shell lint (bash)
        run: |
          git ls-files '*.sh' install.sh 05-ai/ollama/bin/ollama-backend | xargs shellcheck -S warning
          git ls-files '*.sh' install.sh | xargs -n1 bash -n
      - name: Shell syntax (zsh)
        run: |
          for f in 03-terminal/zsh/.zshrc 06-tools/focus/scripts/focus 06-tools/focus/scripts/focus-refresh; do zsh -n "$f"; done
      - name: install.sh smoke test in a throwaway HOME
        run: bash tools/smoke_install.sh
